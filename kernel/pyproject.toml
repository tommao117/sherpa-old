[project]
name = "sherpa-kernel"
version = "0.1.0"
description = "Sherpa judge: measurement contract, correctness oracle, Task Bench. Human-owned; Sherpa cannot modify it."
requires-python = ">=3.11"
# Every dependency is pinned exactly: the judge's behaviour must not drift when the
# rest of Sherpa (or the machine's other environments) changes.
dependencies = [
  "pyyaml==6.0.3",
  "aiohttp==3.13.4",
  "jsonschema==4.25.1",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
sherpa-judge = "sherpa_kernel.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sherpa_kernel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
