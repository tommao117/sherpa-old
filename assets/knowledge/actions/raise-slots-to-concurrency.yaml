id: raise-slots-to-concurrency
node: request.time_per_token
kind: move_bound
when:
  decode_bound: memory
  slots_over_concurrency: "<0.5"
effect:
  metric: output_tok_per_s
  change_pct: [60, 90]
apply:
  llama.cpp:
    knobs:
      parallel: concurrency
evidence: [t20261110-110453/f001]
counter: []
notes: |
  decode 的每 step 成本可分为两部分：按 step 固定（读一遍权重，op.gemm 的下界）和按 token 线性
  （attention 读 KV、logits 回拷、CPU 采样）。把 slots 提到并发数后，固定部分被分摊到 B 倍 token 上，
  线性部分不变，因此收益上限取决于固定部分原本占的比例。
  前提：显存能放下 concurrency 个 slot 的 KV（见 capacity.max_slots_by_memory），否则 slots 会被截断。
  注意 llama.cpp 的 -np 默认是 auto，实测为 4，远小于常见并发，所以这条在默认配置下几乎总是适用。
  代价：总上下文被切分到各 slot（n_ctx_slot 从 40960 降到 5888），长上下文请求可能放不下。
