# 可调参数及其作用的账本节点。kind: move_bound | close_gap；lossy_unless: 取值不在列表内即视为有损
# risk: stable | experimental（experimental 的 knob 进入交付物时需在 deliverable 中标注）
knobs:
  parallel:
    flag: -np
    type: int
    default: -1            # auto（b12242 上 auto=4）
    node: request.time_per_token
    kind: move_bound
    risk: stable
    doc: 服务端并行槽位数，决定 decode batch 上限；提高它会把总上下文切分到各 slot
  ctx_size:
    flag: -c
    type: int
    default: 0             # 0 = 模型训练长度
    node: request.time_per_token
    kind: move_bound
    risk: stable
    doc: 总上下文（KV 容量）
  batch_size:
    flag: -b
    type: int
    default: 2048
    node: op.gemm
    kind: close_gap
    risk: stable
  ubatch_size:
    flag: -ub
    type: int
    default: 512
    node: op.gemm
    kind: close_gap
    risk: stable
  flash_attn:
    flag: -fa
    type: enum
    values: ["on", "off", "auto"]
    default: auto
    node: op.attention
    kind: close_gap
    risk: stable
  cache_type_k:
    flag: -ctk
    type: enum
    values: [f16, bf16, q8_0, q4_0]
    default: f16
    node: op.attention
    kind: move_bound
    risk: stable
    lossy_unless: [f16, bf16]
  cache_type_v:
    flag: -ctv
    type: enum
    values: [f16, bf16, q8_0, q4_0]
    default: f16
    node: op.attention
    kind: move_bound
    risk: stable
    lossy_unless: [f16, bf16]
  cont_batching:
    flag_on: -cb
    flag_off: -nocb
    type: bool
    default: true
    node: request.outside_gpu_window
    kind: close_gap
    risk: stable
  backend_sampling:
    flag_on: -bs
    type: bool
    default: false
    node: step.gpu_idle
    kind: close_gap
    risk: experimental
    doc: |
      把采样放到 GPU 上（框架自称 experimental）。与 grammar / reasoning budget / n_probs>0
      不兼容，这些情况下会静默回退到 CPU 采样。会改变采样实现路径，greedy 正确性门禁无法验证其语义等价性。
  poll:
    flag: --poll
    type: int
    default: 50
    node: step.gpu_idle
    kind: close_gap
    risk: stable
  threads:
    flag: -t
    type: int
    default: -1
    node: step.gpu_idle
    kind: close_gap
    risk: stable
  cuda_graphs:
    env_off: {GGML_CUDA_DISABLE_GRAPHS: "1"}
    type: bool
    default: true
    node: step.gpu_idle
    kind: close_gap
    risk: stable
