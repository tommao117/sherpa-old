# 决策点：由哪些事件触发、用哪份 policy、输出什么 schema、用哪档模型。
# 可进化：决策点集合、触发条件、policy 文本。不可进化：事件的语义、输出的处理方式（runtime/engine）。
decisions:
  plan:
    triggers: [baseline_ready, judge_continue]
    policy: plan.md
    output: schemas/plan.json
    model: strong
  monitor:
    triggers: [watcher_alert]
    policy: monitor.md
    output: schemas/monitor.json
    model: fast
  analyze:
    triggers: [experiment_finished, experiment_killed, experiment_failed]
    policy: analyze.md
    output: schemas/analyze.json
    model: strong
  judge:
    triggers: [round_done]
    policy: judge.md
    output: schemas/judge.json
    model: strong
