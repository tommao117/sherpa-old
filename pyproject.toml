[project]
name = "sherpa"
version = "0.2.0"
description = "Observable, serial inference-optimization runtime"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sherpa = "sherpa.cli:main"

[build-system]
requires = ["setuptools==75.6.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sherpa*"]

[tool.setuptools.package-data]
"sherpa.agent" = ["models.toml", "environment_policy.toml"]
