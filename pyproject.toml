[project]
name = "sherpa"
version = "0.0.1"
description = "Self-iterating inference optimization framework"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
  "aiohttp>=3.9",
  "jsonschema>=4.0",
]

[project.scripts]
sherpa = "sherpa.cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sherpa*"]
