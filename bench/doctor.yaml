    commit: "2241453"
    fa0: {pp512: 11992.70, tg128: 186.21}
    fa1: {pp512: 14770.63, tg128: 188.96}
  "NVIDIA GeForce RTX 5070 Ti":
    commit: "933414c"
    fa0: {pp512: 6952.38, tg128: 176.85}
