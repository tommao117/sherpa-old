# Machine health check: llama.cpp's community CUDA scoreboard, run before any scoring.
# If a machine is far below the published numbers for its GPU, the problem is the environment
# (drivers, clocks, WSL, thermals), not an optimization opportunity.
source: https://github.com/ggml-org/llama.cpp/discussions/15013
model:
  file: llama-2-7b.Q4_0.gguf
  url: https://huggingface.co/TheBloke/Llama-2-7B-GGUF/resolve/main/llama-2-7b.Q4_0.gguf
  sha256: 78b8f9777dd620ad29cd2cffb6653b17fa8a5b1fddc1b8821180d60eedd24d48
build: b12242                 # judge-pinned llama.cpp used for the check
command: "llama-bench -m <model> -ngl 99 -fa 0,1 -o json"
max_slowdown: 0.10            # fail if any metric is >10% below the scoreboard (faster is fine: newer code)
scoreboard:                   # tokens/s as published (single GPU)
