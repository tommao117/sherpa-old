id: cfg-qwen3-0.6b-chat-c32-lossy
kind: config
split: train
description: Same traffic as cfg-qwen3-0.6b-chat-c32, but lossy optimizations (weight
  / KV quantisation) are allowed as long as GSM8K-100 accuracy stays within 3 points
  of the floor build.
machine: rtx-5070-ti@tommao-pc4
framework:
  name: llama.cpp
  base: b12242
model:
  hf: Qwen/Qwen3-0.6B
  revision: c1899de289a04d12100db370d81485cdf75e47ca
  slug: qwen3-0.6b
  reference: oracle/references/qwen3-0.6b.json
workload:
  prompt_tokens: 256
  output_tokens: 128
  concurrency: 32
  num_requests: 256
  warmup_requests: 32
  sampling:
    temperature: 0.8
    top_k: 40
    top_p: 0.95
    min_p: 0.05
  vocab_hi: 100000
objective:
  metric: output_tok_per_s
  higher_is_better: true
contract:
  max_context: 4096
  logprobs: false
  lossy: true
  model_dtypes:
  - bf16
  - q8_0
  - q6_k
  - q5_k_m
  - q4_k_m
  accuracy:
    set: gsm8k-100
    max_drop: 0.03
measure:
  pairs: 3
  max_pairs: 8
